# Prometheus configuration — scrapes the API /metrics endpoint directly,
# plus the Pushgateway (worker-only counters: SSRF rejections, generation
# schema-validation failures, real API spend — see
# app/core/metrics_push.py for why these can't just be scraped directly).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "cv-tailoring-api"

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          service: "cv-tailoring-workers"