name: Backend CI

# Sprint 6 hardening — closes security-plan §13 gap 4 and §14's
# "dependency and secret scanning are active CI gates" bar.
# Test job: migrations + full suite (minus the full-Docker-stack file) + pip-audit.
# Secret-scan job: gitleaks full-history scan on main/schedule and on PRs.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history secret scan — catches secrets that predate the
    # per-commit gate or that only became secret-shaped after a policy change.
    - cron: "0 3 * * 1"

jobs:
  test:
    name: Migrations + pytest + dependency audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvapp
          POSTGRES_PASSWORD: cvapp_local
          POSTGRES_DB: cv_tailoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvapp -d cv_tailoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cvapp:cvapp_local@localhost:5432/cv_tailoring
      DATABASE_URL_ASYNC: postgresql+asyncpg://cvapp:cvapp_local@localhost:5432/cv_tailoring
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libs (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply migrations
        run: |
          cd backend
          python -m alembic upgrade head
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -q --ignore=tests/test_regression_full_chain.py
      - name: Dependency vulnerability scan (pip-audit)
        # pip-audit has no severity filter; it exits non-zero on ANY finding.
        # This is intentionally stricter than "high/critical only" — a low/
        # medium finding still blocks merge rather than silently accumulating.
        run: |
          cd backend
          pip install pip-audit
          pip-audit -r requirements.txt

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans the whole repo, not just HEAD
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  restore-drill:
    # Weekly automated backup+restore+verify, same cadence as secret-scan
    # above. Bounded to CI's own ephemeral Postgres (self-managed-Postgres
    # path — see the DR item's RDS-vs-self-managed note; if RDS is chosen
    # instead, the equivalent check becomes a scheduled Lambda restoring
    # the latest RDS snapshot, not this job) — this is a real, automated,
    # tested restore, it just isn't rehearsing against production's actual
    # data volume/latency. That gap needs real ops access this job can't
    # have; what it CAN prove unattended, every week: a fresh backup
    # restores cleanly, is migration-consistent, and matches the row
    # counts it was taken from. A human is only needed when this fails.
    name: DR restore drill (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvapp
          POSTGRES_PASSWORD: cvapp_local
          POSTGRES_DB: cv_tailoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvapp -d cv_tailoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cvapp:cvapp_local@localhost:5432/cv_tailoring
      DATABASE_URL_ADMIN: postgresql://cvapp:cvapp_local@localhost:5432/postgres
      PGPASSWORD: cvapp_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies + postgresql-client
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply migrations, then seed a small amount of real data
        run: |
          cd backend
          python -m alembic upgrade head
          # A restore drill against an empty database proves nothing about
          # whether real rows survive the round trip.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (id, email, password_hash, status, created_at, updated_at)
            VALUES (gen_random_uuid(), 'restore-drill@test.example', 'x', 'active', now(), now());
          "
      - name: Backup
        run: |
          cd backend
          chmod +x scripts/backup_db.sh
          ./scripts/backup_db.sh ./ci-backups
      - name: Restore and verify
        run: |
          cd backend
          chmod +x scripts/restore_db.sh
          DUMP_FILE=$(ls ./ci-backups/*.dump | head -1)
          ./scripts/restore_db.sh "$DUMP_FILE" cv_tailoring_restore_drill
